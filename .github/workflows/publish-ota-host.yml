name: Publish OTA artifact host

on:
  push:
    branches: [main]
    paths: [catalog.json, firmware/**, ota-host/**, .github/workflows/publish-ota-host.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssiot-ota-artifact-host
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository Action secrets before publishing the OTA host."
            exit 1
          fi
      - name: Prepare selected Production and Candidate artifacts
        run: node ota-host/prepare-assets.mjs
      - name: Deploy isolated OTA host
        run: npx --yes wrangler@4 deploy --config ota-host/wrangler.jsonc --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
